<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CF96" />
      <stop offset="45%" stop-color="#C6A66B" />
      <stop offset="100%" stop-color="#9C7938" />
    </linearGradient>
  </defs>
  <!-- Monogram Seal -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="12" fill="#181818" stroke="url(#brandGold)" stroke-width="1.5" />
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#brandGold)" stroke-width="0.75" stroke-dasharray="2 3" />
    <text x="30" y="38" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="url(#brandGold)" text-anchor="middle" letter-spacing="1">EB</text>
  </g>
  <!-- Brand Typography -->
  <g transform="translate(86, 0)">
    <text x="0" y="42" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="24" font-weight="600" fill="#FFFFFF" letter-spacing="4">ESLAM BSISA</text>
    <text x="2" y="62" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="url(#brandGold)" letter-spacing="7">P H O T O G R A P H Y</text>
  </g>
